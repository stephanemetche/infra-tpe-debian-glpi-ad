# /etc/apache2/sites-available/glpi.conf
# Seul le dossier public/ est exposé : config/ et files/ restent hors du web.
<VirtualHost *:80>
    ServerName 192.168.60.20
    DocumentRoot /var/www/glpi/public

    <Directory /var/www/glpi/public>
        Require all granted
        RewriteEngine On
        # Transmettre l'en-tête Authorization (API GLPI)
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        # Toute requête qui ne vise pas un fichier existant passe par index.php
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/glpi_error.log
    CustomLog ${APACHE_LOG_DIR}/glpi_access.log combined
</VirtualHost>
# Activation : a2enmod rewrite && a2dissite 000-default && a2ensite glpi
#              apache2ctl configtest && systemctl restart apache2
