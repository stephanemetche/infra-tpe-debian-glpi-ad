# /etc/ssh/sshd_config.d/10-durcissement.conf
# Durcissement SSH - SRVGLPI01
# Toujours valider avec `sudo sshd -t` avant `sudo systemctl restart ssh`,
# et garder une session ouverte pendant les tests.

Port 2222                        # réduit le bruit des scans automatiques sur le port 22
PermitRootLogin no               # root ne se connecte jamais à distance (passer par sudo)
PubkeyAuthentication yes         # authentification par clé
PasswordAuthentication no        # pas de mot de passe : force brute impossible
KbdInteractiveAuthentication no  # pas d'authentification interactive de secours
PermitEmptyPasswords no
AllowUsers stephane              # liste blanche des comptes autorisés
MaxAuthTries 3                   # 3 tentatives par connexion
LoginGraceTime 30                # 30 s pour s'authentifier
X11Forwarding no                 # pas d'affichage graphique déporté
AllowAgentForwarding no          # pas de transfert d'agent SSH
AllowTcpForwarding no            # pas de tunnels
ClientAliveInterval 300          # sonde toutes les 5 min...
ClientAliveCountMax 2            # ...et ferme une session abandonnée après ~10 min
